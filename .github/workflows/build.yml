name: Build Crafting Planner candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'CraftingPlanner.csproj'
      - 'src/**'
      - 'references/**'
      - 'tests/**'
      - 'nuget.config'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: crafting-planner-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CraftingPlanner.csproj --configfile nuget.config

      - name: Build
        run: dotnet build CraftingPlanner.csproj -c Release --no-restore --nologo -p:PlannerCalibration=false

      - name: Check candidate source and version identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source checkout' }
          $match = [regex]::Match((Get-Content src/CraftingPlanner.cs -Raw), 'public const string PluginVersion = "(\d+\.\d+\.\d+)";')
          if (!$match.Success) { throw 'Missing canonical plugin version' }
          $version = $match.Groups[1].Value
          $dll = (Resolve-Path 'bin/Release/CraftingPlanner.dll').Path
          if ([Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString() -ne "$version.0") { throw 'Assembly version mismatch' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion -ne "$version.0") { throw 'File version mismatch' }
          "CANDIDATE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test rounded backing policy and localization coverage
        shell: pwsh
        run: |
          $testSource = (Resolve-Path -LiteralPath 'tests/CardTests.cs').Path
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /out:CardTests.exe $testSource
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          $bepFolders = @(Get-ChildItem "$env:USERPROFILE/.nuget/packages/bepinex.baselib" -Recurse -Filter BepInEx.dll | Select-Object -ExpandProperty DirectoryName -Unique)
          if ($bepFolders.Count -eq 0) { throw 'Missing restored BepInEx test dependency' }
          & ./CardTests.exe bin/Release/CraftingPlanner.dll bin/Release references/Assembly-CSharp/bin/Release/net472 references/Assembly-CSharp-firstpass/bin/Release/net472 references/Rewired_Core/bin/Release/net472 "$env:USERPROFILE/.nuget/packages/unity3d.sdk/2020.3.13.1/lib" @bepFolders --state --no-calibration
          if ($LASTEXITCODE -ne 0) { throw 'Card policy checks failed' }

      - name: Verify package boundary
        shell: pwsh
        run: |
          $dll = 'bin/Release/CraftingPlanner.dll'
          if (!(Test-Path $dll)) {
            throw "Expected DLL not found: $dll"
          }
          if (Test-Path 'bin/Release/Assembly-CSharp.dll') {
            throw 'Compile-time Assembly-CSharp stub leaked into output.'
          }
          if (Test-Path 'bin/Release/Assembly-CSharp-firstpass.dll') {
            throw 'Compile-time Assembly-CSharp-firstpass stub leaked into output.'
          }
          if (Test-Path 'bin/Release/Rewired_Core.dll') {
            throw 'Compile-time Rewired_Core stub leaked into output.'
          }

      - name: Package numbered candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $target = "artifacts/CraftingPlanner-$env:CANDIDATE_VERSION.dll"
          Copy-Item bin/Release/CraftingPlanner.dll $target
          $identity = [ordered]@{
            version = $env:CANDIDATE_VERSION
            source = $env:GITHUB_SHA
            run = $env:GITHUB_RUN_ID
            artifact = (Split-Path $target -Leaf)
            sha256 = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            status = 'candidate-not-runtime-accepted'
            calibration = $false
          }
          $identity | ConvertTo-Json | Set-Content artifacts/build-identity.json -Encoding utf8

      - name: Package installable player archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "CraftingPlanner-package-$env:GITHUB_RUN_ID"
          if (Test-Path $stage) { throw 'Package staging directory already exists' }
          $plugins = Join-Path $stage 'BepInEx/plugins'
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Copy-Item bin/Release/CraftingPlanner.dll (Join-Path $plugins 'CraftingPlanner.dll')
          foreach ($name in @('README.md','CHANGELOG.md','LICENSE','LICENSING.md')) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name)
          }
          $identity = Get-Content artifacts/build-identity.json -Raw | ConvertFrom-Json
          if ($identity.version -ne $env:CANDIDATE_VERSION -or $identity.source -ne $env:GITHUB_SHA -or $identity.calibration -ne $false) { throw 'Package identity mismatch' }
          $readmeVersion = [regex]::Match((Get-Content README.md -Raw), 'Version\s+\*\*(\d+\.\d+\.\d+)\*\*').Groups[1].Value
          $changelogVersion = [regex]::Match((Get-Content CHANGELOG.md -Raw), '(?m)^## (\d+\.\d+\.\d+)\b').Groups[1].Value
          if ($readmeVersion -ne $env:CANDIDATE_VERSION -or $changelogVersion -ne $env:CANDIDATE_VERSION) { throw 'Player-document version mismatch' }
          $packageIdentity = [ordered]@{
            version = $identity.version
            source = $identity.source
            run = $identity.run
            artifact = 'BepInEx/plugins/CraftingPlanner.dll'
            sha256 = $identity.sha256
            calibration = $false
            sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
          }
          $packageIdentity | ConvertTo-Json | Set-Content (Join-Path $stage 'build-identity.json') -Encoding utf8
          $allowed = @('BepInEx/plugins/CraftingPlanner.dll','README.md','CHANGELOG.md','LICENSE','LICENSING.md','build-identity.json')
          $actual = @(Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($stage,$_.FullName).Replace('\','/') })
          if (@(Compare-Object $allowed $actual).Count -ne 0) { throw 'Unexpected player package contents' }
          if ((Get-FileHash (Join-Path $plugins 'CraftingPlanner.dll')).Hash.ToLowerInvariant() -ne $identity.sha256) { throw 'Packaged DLL digest mismatch' }
          $archive = "artifacts/Building-Planner-$env:CANDIDATE_VERSION.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
          $identity | Add-Member -NotePropertyName package -NotePropertyValue (Split-Path $archive -Leaf)
          $identity | Add-Member -NotePropertyName packageSha256 -NotePropertyValue ((Get-FileHash $archive).Hash.ToLowerInvariant())
          $identity | ConvertTo-Json | Set-Content artifacts/build-identity.json -Encoding utf8

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: CraftingPlanner-${{ env.CANDIDATE_VERSION }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
