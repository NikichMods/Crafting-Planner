name: Verify Crafting Planner development

on:
  workflow_dispatch:
  push:
    branches:
      - dev/codex-migration
    paths:
      - 'CraftingPlanner.csproj'
      - 'src/**'
      - 'references/**'
      - 'nuget.config'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: crafting-planner-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CraftingPlanner.csproj --configfile nuget.config

      - name: Build
        run: dotnet build CraftingPlanner.csproj -c Release --no-restore --nologo

      - name: Verify package boundary
        shell: pwsh
        run: |
          $dll = 'bin/Release/CraftingPlanner.dll'
          if (!(Test-Path $dll)) {
            throw "Expected DLL not found: $dll"
          }
          if (Test-Path 'bin/Release/Assembly-CSharp.dll') {
            throw 'Compile-time Assembly-CSharp stub leaked into output.'
          }
          if (Test-Path 'bin/Release/Assembly-CSharp-firstpass.dll') {
            throw 'Compile-time Assembly-CSharp-firstpass stub leaked into output.'
          }
